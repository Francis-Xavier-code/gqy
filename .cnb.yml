# GQY 云原生构建流水线（CNB）
#
# 原 .github/workflows/release.yml（GitHub Actions）迁移而来。
# CNB 云端构建环境为 Linux Docker 容器，通过 zig 交叉编译产出 macOS 二进制。
#
# 触发规则：
#   main 分支 push        → CI（fmt + clippy + test）
#   任意分支 PR           → CI（fmt + clippy + test）
#   v* tag push           → 完整发布（CI + 双架构 macOS 交叉编译 + Release 发布）
#
# 构建环境见 .cnb/Dockerfile（rust + zig + cargo-zigbuild + macOS SDK），
# 由 docker.build 引用并自动缓存镜像层。

# ── CI 构建环境（共享模板） ─────────────────────────────
.ci-env: &ci-env
  docker:
    build:
      dockerfile: .cnb/Dockerfile
      by:
        - .cnb/Dockerfile
        - Cargo.toml
        - Cargo.lock
      versionBy:
        - .cnb/Dockerfile
    volumes:
      - cargo-registry:/usr/local/cargo/registry:copy-on-write
      - cargo-git:/usr/local/cargo/git:copy-on-write
      - target:/workspace/target:copy-on-write
  env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

# ── CI 步骤（fmt + clippy + test，供 push / PR / tag 复用） ──
.ci-stages: &ci-stages
  - name: format
    script: cargo fmt --all --check
  - name: clippy
    script: cargo clippy --all-targets -- -D warnings
  - name: test
    script: cargo test --all

# ── main 分支 push：CI ─────────────────────────────────
main:
  push:
    - name: ci
      <<: *ci-env
      stages: *ci-stages

# ── 任意分支 PR：CI ────────────────────────────────────
"**":
  pull_request:
    - name: pr-ci
      <<: *ci-env
      stages: *ci-stages

# ── v* tag：完整发布 ───────────────────────────────────
"$":
  tag_push:
    - name: release
      <<: *ci-env
      stages:
        # tag_push 为仓库级事件需放 $ 下；非 v* 标签不触发完整发布。
        - name: gate
          if: 'echo "$CNB_BRANCH" | grep -Eq "^v[0-9]+\."'
          script: echo "release tag $CNB_BRANCH"
        - name: format
          if: 'echo "$CNB_BRANCH" | grep -Eq "^v[0-9]+\."'
          script: cargo fmt --all --check
        - name: clippy
          if: 'echo "$CNB_BRANCH" | grep -Eq "^v[0-9]+\."'
          script: cargo clippy --all-targets -- -D warnings
        - name: test
          if: 'echo "$CNB_BRANCH" | grep -Eq "^v[0-9]+\."'
          script: cargo test --all
        # ── 双架构 macOS 交叉编译（并行 job） ──
        - name: build-macos
          if: 'echo "$CNB_BRANCH" | grep -Eq "^v[0-9]+\."'
          jobs:
            build-arm64:
              script: bash scripts/build-macos.sh aarch64-apple-darwin
            build-x86_64:
              script: bash scripts/build-macos.sh x86_64-apple-darwin
        # ── 双架构 Linux 静态交叉编译（并行 job，musl） ──
        - name: build-linux
          if: 'echo "$CNB_BRANCH" | grep -Eq "^v[0-9]+\."'
          jobs:
            build-arm64:
              script: bash scripts/build-linux.sh aarch64-unknown-linux-musl
            build-x86_64:
              script: bash scripts/build-linux.sh x86_64-unknown-linux-musl
        # ── 打包 + 生成 formula（等待所有架构都构建完成） ──
        - name: package
          if: 'echo "$CNB_BRANCH" | grep -Eq "^v[0-9]+\."'
          script: bash scripts/release-package.sh
        # ── 将在线安装脚本复制到根目录，随 Release 一并上传（公开下载） ──
        - name: copy-install-script
          if: 'echo "$CNB_BRANCH" | grep -Eq "^v[0-9]+\."'
          script: cp scripts/install.sh ./install.sh && chmod +x ./install.sh
        # ── 发布 Release + 上传附件 ──
        - name: create-release
          if: 'echo "$CNB_BRANCH" | grep -Eq "^v[0-9]+\."'
          type: git:release
          options:
            tag: $CNB_BRANCH
            title: "GQY $CNB_BRANCH"
            description: "GQY（顾清影）发布 $CNB_BRANCH：macOS 双架构 + Linux 双架构预编译资产。\n详见 https://cnb.cool/xynrin.ptt/GQY"
        - name: upload-assets
          if: 'echo "$CNB_BRANCH" | grep -Eq "^v[0-9]+\."'
          image: cnbcool/attachments:latest
          settings:
            tag: $CNB_BRANCH
            attachments:
              - "./gqy-*.tar.gz"
              - "./install.sh"
